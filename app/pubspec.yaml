name: fgmap
description: "FGMap: aplikasi navigasi komuniti Malaysia."
publish_to: 'none'
version: 1.1.0+13

environment:
  sdk: ^3.12.0

dependencies:
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.1
  crypto: ^3.0.7
  dio: ^5.11.1
  fgmap_valhalla:
    path: ../packages/fgmap_valhalla
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.7
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # 4.2.5 masih apply kotlin-android; guna PR Built-in Kotlin sehingga pub lepaskan versi baharu.
  # https://github.com/dlutton/flutter_tts/pull/660
  flutter_tts:
    git:
      url: https://github.com/fstotz/flutter_tts.git
      ref: codex/apple-packaging-built-in-kotlin
  geolocator: ^14.1.2
  go_router: ^17.5.0
  intl: ^0.20.2
  maplibre_gl: ^0.27.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.7.0
  app_links: ^6.4.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  adhan_dart: ^2.0.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  file_picker: ^13.3.0
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true # flutter gen-l10n (lihat l10n.yaml)

  assets:
    - assets/branding/fgmap-app-icon.png
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/tolls/my_tolls.json
    - assets/cameras/
    - assets/legal/
    - assets/audio/

  fonts:
    # Fon variabel (paksi wght 200-800), dibundel supaya tidak dimuat turun masa jalan.
    # Berat ditetapkan melalui FontVariation dalam core/theme/typography.dart.
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans.ttf

# Lesen fon (SIL OFL 1.1) didaftarkan dalam LicenseRegistry; lihat lib/core/licenses.dart.

# Splash asli: biru laut jenama, sama dengan permulaan splash animasi dalam app (tiada kilat putih/gelap
# antara keduanya, cerah mahupun gelap). Splash animasi: lib/features/splash.
flutter_native_splash:
  color: "#173B78"
  color_dark: "#173B78"
  android_12:
    color: "#173B78"
    color_dark: "#173B78"
  fullscreen: false
