<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Latar depan ikon adaptif Android (kanvas 108 dp). Tanda diskala supaya berada dalam bulatan
    selamat 66 dp (jejari 313 dalam ruang 1024) untuk semua bentuk topeng pelancar.
  -->
  <defs>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="560" y1="108" x2="840" y2="428">
      <stop offset="0" stop-color="#3FF0D2"/>
      <stop offset="1" stop-color="#12B9A0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06122B" flood-opacity=".45"/>
    </filter>
  </defs>
  <g transform="translate(512 512) scale(.6) translate(-563 -497)" filter="url(#lift)">
    <path d="M372 800V418a150 150 0 0 1 150-150h70" fill="none" stroke="#F7F9FC" stroke-width="136" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 540H530" fill="none" stroke="#F7F9FC" stroke-width="136" stroke-linecap="round"/>
    <path d="M560 108 840 268 560 428 616 268Z" fill="url(#teal)" stroke="url(#teal)" stroke-width="36" stroke-linejoin="round"/>
    <circle cx="372" cy="800" r="104" fill="#F7F9FC"/>
    <circle cx="372" cy="800" r="46" fill="#2563EB"/>
  </g>
</svg>
