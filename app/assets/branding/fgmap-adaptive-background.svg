<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Latar belakang ikon adaptif Android: gradien biru laut jenama (sama dengan fgmap-app-icon.svg). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4C9A"/>
      <stop offset=".55" stop-color="#173B78"/>
      <stop offset="1" stop-color="#0C1D3F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".22" r=".8">
      <stop offset="0" stop-color="#5B8FE8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5B8FE8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
</svg>
