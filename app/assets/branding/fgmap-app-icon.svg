<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    Ikon app FGMaps (v2). Tanda "F-laluan": huruf F yang dibina daripada laluan navigasi —
    titik mula (lokasi anda), jalan naik dan membelok, berakhir dengan anak panah arah teal;
    lengan tengah F ialah simpang. Geometri tanda dalam "ruang tanda" (lihat kumpulan #mark),
    sama dengan SplashGeometry dalam lib/features/splash/presentation/splash_painter.dart.
    Varian: fgmap-mark*.svg, fgmap-adaptive-*.svg, fgmap-monochrome.svg. PNG: tools/brand/build_brand.py.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F4C9A"/>
      <stop offset=".55" stop-color="#173B78"/>
      <stop offset="1" stop-color="#0C1D3F"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".22" r=".8">
      <stop offset="0" stop-color="#5B8FE8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5B8FE8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="560" y1="108" x2="840" y2="428">
      <stop offset="0" stop-color="#3FF0D2"/>
      <stop offset="1" stop-color="#12B9A0"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#06122B" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g id="mark" transform="translate(512 512) scale(.84) translate(-563 -497)" filter="url(#lift)">
    <path d="M372 800V418a150 150 0 0 1 150-150h70" fill="none" stroke="#F7F9FC" stroke-width="136" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M372 540H530" fill="none" stroke="#F7F9FC" stroke-width="136" stroke-linecap="round"/>
    <path d="M560 108 840 268 560 428 616 268Z" fill="url(#teal)" stroke="url(#teal)" stroke-width="36" stroke-linejoin="round"/>
    <circle cx="372" cy="800" r="104" fill="#F7F9FC"/>
    <circle cx="372" cy="800" r="46" fill="#2563EB"/>
  </g>
</svg>
