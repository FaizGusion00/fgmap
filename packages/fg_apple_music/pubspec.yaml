name: fg_apple_music
description: >-
  Jambatan natif Apple Music (MusicKit) untuk FGMaps: carian katalog dan main lagu penuh untuk
  pelanggan Apple Music. Hanya iOS; platform lain tidak memuatkan apa-apa.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: FgAppleMusicPlugin
