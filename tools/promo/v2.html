<!doctype html>
<html lang="ms">
<head>

<style>

</head>
<body>
<div id="stage">
  <canvas id="bg"></canvas>

  <canvas id="fg"></canvas>
</div>
<script src="/tools/promo/lib_map.js"></script>
<script>
'use strict';
// ───────────────────────── parameter ─────────────────────────
const Q = new URLSearchParams(location.search);
const ASPECT = Q.get('a') || '16x9', LANG = Q.get('l') || 'ms', VOICE = Q.get('v') || 'main';

const SW = PORT ? 499 : 434, SH = PORT ? 1080 : 940, BZ = PORT ? 14 : 12;
const U = SW / 390;
const stage = document.getElementById('stage');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const $ = id => document.getElementById(id);
const bg = $('bg'), bctx = bg.getContext('2d'), fg = $('fg'), fctx = fg.getContext('2d'), scr = $('scr'), sctx = scr.getContext('2d');

async function loadImg(p) {

  try { await im.decode(); } catch (e) { im.__bad = true; }

  while (IMG.size > 110) IMG.delete(IMG.keys().next().value);

// ───────────────────────── data ─────────────────────────

const LIDS = Array.from({ length: 15 }, (_, i) => 'l' + pad2(i + 1));
async function loadAll() {

}

/** Kad zum: potongan UI app sebenar (koordinat logik 390x844) diperbesar di sisi teks supaya mudah dibaca. */
function callout(c, th, name, r, x, y, w, t0, lt, o = {}) {

// ───────────────────────── layar telefon ─────────────────────────

}

  c.fillText('15:13', 26 * U, 24 * U);

  if (o.noSig) { c.save(); c.translate(x - 8 * U - 8.8 * U, 24 * U - 8.8 * U); c.scale(17.6 / 24, 17.6 / 24); c.fill(PLANE); c.restore(); x -= 30 * U; }
  for (let i = 0; i < 4; i++) { c.globalAlpha = (o.a ?? 1) * (o.noSig ? .28 : 1); c.fillRect(x - 24 * U + i * 6 * U, 30 * U - (4 + i * 3) * U, 4 * U, (4 + i * 3) * U); }

function tapFx(c, name, th, t0, lt, o = {}) {

// ───────────────────────── sarikata ─────────────────────────
function subtitles(c, t, sc) {
  const sz = LAY.sub.size, maxW = LAY.sub.w;
  for (const L of sc.lines) {
    // pecah kepada ayat
    const sents = []; let cur = [];
    for (const w of L.words) { cur.push(w); if (/[.!?]$/.test(w[3] || w[0])) { sents.push(cur); cur = []; } }
    if (cur.length) sents.push(cur);
    for (const s of sents) {
      const a = s[0][1] - .12, b = s[s.length - 1][1] + s[s.length - 1][2] + .45; if (t < a || t > b) continue;
      const alpha = clamp((t - a) / .18) * (1 - clamp((t - (b - .2)) / .2));
      c.save(); c.font = `700 ${sz}px PJS`;
      const lines = []; let line = [], lw = 0; const sp = c.measureText(' ').width;
      s.forEach((w, i) => { const ww = c.measureText(w[3] || w[0]).width; if (lw + ww > maxW && line.length) { lines.push(line); line = []; lw = 0; } line.push([w, i]); lw += ww + sp; });
      if (line.length) lines.push(line);
      const lh = sz * 1.3, boxW = Math.min(maxW + 80, Math.max(...lines.map(l => l.reduce((x, [w]) => x + c.measureText(w[3] || w[0]).width + sp, 0))) + 80), boxH = lines.length * lh + 26, x0 = LAY.sub.cx - boxW / 2, y0 = LAY.sub.y - boxH + 12 - (lines.length - 1) * 0;
      c.globalAlpha = alpha; c.fillStyle = 'rgba(8,14,28,.62)'; rr(c, x0, y0, boxW, boxH, 24); c.fill();
      lines.forEach((ln, li) => {
        const tw = ln.reduce((x, [w]) => x + c.measureText(w[3] || w[0]).width + sp, 0) - sp; let x = LAY.sub.cx - tw / 2; const y = y0 + 13 + lh * (li + .8);
        for (const [w] of ln) { const active = t >= w[1] && t < w[1] + w[2] + .12, done = t >= w[1] + w[2]; c.fillStyle = active ? TEAL : done ? '#FFFFFF' : 'rgba(255,255,255,.62)'; c.textAlign = 'left'; c.fillText(w[3] || w[0], x, y); x += c.measureText(w[3] || w[0]).width + sp; }
      });
      c.restore();
    }
  }
}

  bctx.save(); bctx.globalCompositeOperation = 'screen'; const g1 = bctx.createRadialGradient(w * (PORT ? .1 : .18), h * .1, 0, w * (PORT ? .1 : .18), h * .1, w * .5); g1.addColorStop(0, hue[0] + '55'); g1.addColorStop(1, hue[0] + '00'); bctx.fillStyle = g1; bctx.fillRect(0, 0, w, h);
  const g2 = bctx.createRadialGradient(w * .85, h * .8, 0, w * .85, h * .8, w * .45); g2.addColorStop(0, hue[1] + '44'); g2.addColorStop(1, hue[1] + '00'); bctx.fillStyle = g2; bctx.fillRect(0, 0, w, h); bctx.restore();
}

function layoutPhone() {

  const isl = $('island'); Object.assign(isl.style, { width: SW * .27 + 'px', height: SW * .075 + 'px', left: SW * .365 + 'px', top: SW * .028 + 'px' });
}
function updatePhone(t, i, sc, lt) {
  const cur = phoneTarget(sc.id), prev = i > 0 ? phoneTarget(SCENES[i - 1].id) : { ...cur, hide: true };
  let hide = cur.hide; if (sc.id === 's01') hide = S.s01.phoneHide(lt, sc) === 1;
  const k = eio(clamp(lt / .7)), mix = (a, b) => lerp(a, b, k);
  let x = mix(prev.x, cur.x), y = mix(prev.y, cur.y), s = mix(prev.sc, cur.sc), ry = mix(prev.ry || 0, cur.ry || 0);
  let a = 1; const wasHidden = prev.hide || (i === 1 && SCENES[0].id === 's01'), nowHidden = hide;
  if (sc.id === 's01') { const en = hide ? 0 : eio(clamp((lt - (S.s01.cues(sc).wal - sc.t0 + .1)) / .8)); a = en; y = cur.y + (1 - en) * 140; s = .9 + .1 * en; x = cur.x; ry = cur.ry; }
  else if (nowHidden) { a = 1 - k; y += k * 120; if (prev.hide) a = 0; }
  else if (wasHidden) { a = k; y += (1 - k) * 140; s = lerp(.9, cur.sc, k); x = cur.x; ry = cur.ry || 0; }
  const fl = Math.sin(t * 1.25) * 7;

  ph.style.left = (x - SW / 2) + 'px'; ph.style.top = (y - SH / 2 + fl) + 'px';
  ph.style.transform = `scale(${s}) rotateX(${PORT ? 2 : 3}deg) rotateY(${ry + Math.sin(t * .55) * 1.8}deg)`;
  ph.style.transformOrigin = '50% 50%';
}
function transitionFx(t, sc, lt) {

  const p = clamp((d0 + .12) / .5); if (p <= 0 || p >= 1) return;

  const g = c.createLinearGradient(x - W * .25, 0, x + W * .08, H * .3); g.addColorStop(0, 'rgba(25,211,184,0)'); g.addColorStop(.7, 'rgba(25,211,184,.35)'); g.addColorStop(.92, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(79,139,255,0)');

// ───────────────────────── bingkai ─────────────────────────
async function renderFrame(t) {
