// ───────────────────────── kamera gambaran keseluruhan ─────────────────────────
function overviewCam(sw, sh, topFrac, botFrac, routesIdx, pad = .9, phi = 90, brg = 0) {
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const i of routesIdx) for (const p of OV[i].pts) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  const aw = sw * .84, ah = sh * (botFrac - topFrac) * .9;
  const ppm = Math.min(aw / (x1 - x0), ah / (y1 - y0)) * pad;
  return mkCam((x0 + x1) / 2, (y0 + y1) / 2, brg, phi, ppm, sw / 2, sh * (topFrac + botFrac) / 2);
}
const fmtDur = s => { const m = Math.ceil(s / 60); return m >= 60 ? `${Math.floor(m / 60)} ${LANG === 'ms' ? 'j' : 'h'} ${m % 60} min` : `${m} min`; };
const ROUTE_COL = ['#19D3B8', '#7C93C4', '#7C93C4', '#7C93C4', '#7C93C4'];

function drawRoutesOverview(ctx, cam, dark, sel, draw, opt = {}) {
  const pal = PAL[dark ? 'dark' : 'light'];
  const order = [...Array(OV.length).keys()].filter(i => i !== sel).concat([sel]);
  for (const i of order) {
    const r = OV[i], isSel = i === sel, p = Array.isArray(draw) ? draw[i] : draw;
    const s1 = r.len * p; if (s1 <= 1) continue;
    if (opt.onlySel && !isSel) continue;
    strokeRoute(ctx, cam, r, 0, s1, (isSel ? 11 : 8.5) * U, pal.routeCas, 1);
    strokeRoute(ctx, cam, r, 0, s1, (isSel ? 7.5 : 5.2) * U, isSel ? '#19D3B8' : (dark ? '#4A6396' : '#8EA2CC'), 1);
  }
}
function pillOnRoute(ctx, cam, i, frac, text, sel, dark, a = 1) {
  const r = OV[i]; const p = atAlong(r, r.len * frac); const q = pr(cam, p.x, p.y);
  ctx.save(); ctx.globalAlpha = a;
  pill(ctx, text, q[0], q[1], { center: true, fs: 12.5, u: U, bg: sel ? '#19D3B8' : (dark ? '#1C2B49' : '#fff'), fg: sel ? '#052B26' : (dark ? '#EAF1FF' : '#10244A'), stroke: sel ? null : (dark ? '#3A4C78' : '#C9D2E6') });

}

// ───────────────────────── skrin telefon: babak ─────────────────────────
const sheetY = (sw, sh, im, slide = 1) => { const h = im.naturalHeight * sw / im.naturalWidth; return sh - h * slide; };

const th = dark => dark ? 'dark' : 'light';

function scrS1(c, sw, sh, lt, dur) {
  const dark = false, pal = PAL.light;
  const cam = overviewCam(sw, sh, .12, .74, [0], .92);
  drawMap(c, sw, sh, cam, pal);
  const p = eio(clamp((lt - .6) / 2.4));
  drawRoutesOverview(c, cam, dark, 0, p, { onlySel: true });
  const o = OV[0]; const a0 = atAlong(o, 0), a1 = atAlong(o, o.len * p);
  const q0 = pr(cam, a0.x, a0.y), q1 = pr(cam, a1.x, a1.y), qe = pr(cam, o.pts[o.pts.length - 1][0], o.pts[o.pts.length - 1][1]);
  pin(c, qe[0], qe[1], 16 * U, '#E5484D', 'KLIA', dark);
  c.save(); c.fillStyle = '#2563EB'; c.strokeStyle = '#fff'; c.lineWidth = 3.5 * U; c.beginPath(); c.arc(q0[0], q0[1], 8 * U, 0, 7); c.fill(); c.stroke(); c.restore();
  const pulse = (lt * .9) % 1; ripple(c, q0[0], q0[1], pulse, '#2563EB', 38 * U);
  if (p > 0 && p < 1) { c.save(); c.fillStyle = '#fff'; c.shadowColor = '#19D3B8'; c.shadowBlur = 22 * U; c.beginPath(); c.arc(q1[0], q1[1], 6 * U, 0, 7); c.fill(); c.restore(); }
  c.save(); c.font = `800 ${13 * U}px PJS`; c.textAlign = 'center'; c.lineWidth = 4 * U; c.strokeStyle = '#fff'; c.strokeText('KLCC', q0[0], q0[1] + 24 * U); c.fillStyle = '#10244A'; c.fillText('KLCC', q0[0], q0[1] + 24 * U); c.restore();
  // pil ETA sebenar muncul selepas laluan siap
  const ea = eback(clamp((lt - 3.0) / .5));
  if (ea > 0) { c.save(); c.globalAlpha = clamp(ea); c.translate(0, (1 - ea) * 20 * U); const t = `${fmtDur(ROUTES[0].durationS)} · ${(ROUTES[0].distanceM / 1000).toFixed(1)} km`; pill(c, t, sw / 2, sh * .79, { center: true, fs: 17, h: 40, px: 18, bg: '#10244A', fg: '#fff', shadow: true, icon: (cc, x, y, s) => { cc.fillStyle = '#19D3B8'; cc.beginPath(); cc.arc(x, y, s * .32, 0, 7); cc.fill(); } }); c.restore(); }

function scrS2(c, sw, sh, lt, dur) {
  const dark = false, pal = PAL.light;
  const cam = overviewCam(sw, sh, .06, .5, [0], .9);
  drawMap(c, sw, sh, cam, pal);
  drawRoutesOverview(c, cam, dark, 0, 1, { onlySel: true });
  const o = OV[0], q0 = pr(cam, o.pts[0][0], o.pts[0][1]), qe = pr(cam, o.pts[o.pts.length - 1][0], o.pts[o.pts.length - 1][1]);
  pin(c, qe[0], qe[1], 14 * U, '#E5484D', 'KLIA', dark);
  c.fillStyle = '#2563EB'; c.strokeStyle = '#fff'; c.lineWidth = 3 * U; c.beginPath(); c.arc(q0[0], q0[1], 7 * U, 0, 7); c.fill(); c.stroke();

  // lembaran offline: idle -> tekan -> kemajuan -> siap

  const st = lt < tp ? 'idle' : lt < tp + .75 ? 'p35' : lt < tp + 1.5 ? 'p72' : 'done';

  // butang Muat turun ditekan (kedudukan sebenar pada PNG: ~(125,263) logik)

function scrNav(c, sw, sh, along, dark, lt, opt = {}) {
  const pal = PAL[dark ? 'dark' : 'light'];
  const ns = navState(along);
  const cam = mkCam(ns.x, ns.y, ns.cam, 35, (opt.ppm || .85) * U, sw / 2, sh * .66);
  drawMap(c, sw, sh, cam, pal);

  strokeRoute(c, cam, NAV, 0, along, 12 * U, pal.routeCas, .55);
  strokeRoute(c, cam, NAV, 0, along, 7.5 * U, '#19D3B8', .28);
  strokeRoute(c, cam, NAV, along, NAV.len, 13.5 * U, pal.routeCas, 1);
  strokeRoute(c, cam, NAV, along, NAV.len, 8.5 * U, '#19D3B8', 1);
  // kereta
  const k = clamp(Math.round(Math.abs(ns.yawDeg) * 0.6 / 5) * 5, 0, 55);
  const sgn = ns.yawDeg >= 0 ? 'p' : 'm';
  const car = img(`car/car_${th(dark)}_${k === 0 ? 'p' : sgn}${k}.png`) || img(`car/car_${th(dark)}_p0.png`);
  const S = 205 * U / 1.0; if (car && car.naturalWidth) c.drawImage(car, sw / 2 - S * .5, cam.cy - S * .62, S, S);

  const hk = hudIndex(along);
  const tn = `nav/top_${LANG}_${th(dark)}_${hk}.png`, bn = `nav/bot_${LANG}_${th(dark)}_${hk}.png`, un = `nav/bub_${LANG}_${th(dark)}_${hk}.png`;
  const hs = (opt.hudScale || 1);
  const tIm = img(tn), bIm = img(bn), uIm = img(un);
  const hudIn = eout(clamp(lt / .7));
  if (tIm && tIm.naturalWidth) { const h = tIm.naturalHeight * sw / tIm.naturalWidth; c.drawImage(tIm, 0, 38 * U - (1 - hudIn) * (h + 60 * U), sw, h); }
  if (bIm && bIm.naturalWidth) { const h = bIm.naturalHeight * sw / bIm.naturalWidth; const y = sh - h - 20 * U + (1 - hudIn) * (h + 40 * U); c.drawImage(bIm, 0, y, sw, h); if (uIm && uIm.naturalWidth) { const h2 = uIm.naturalHeight * sw / uIm.naturalWidth; c.drawImage(uIm, 0, y - h2 + 14 * U, sw, h2); } }

}

  scrNav(c, sw, sh, along, false, lt);
}

function scrS4(c, sw, sh, lt, dur) {
  const dark = false, pal = PAL.light;
  const n = Math.min(PORT ? 3 : 5, ROUTES.length);
  const step = (dur - 1.2) / n;
  const idx = clamp(Math.floor((lt - .9) / step), 0, n - 1);
  const slide = eout(clamp(lt / .8));
  const cam = overviewCam(sw, sh, .06, .5, [...Array(n).keys()], .93);
  drawMap(c, sw, sh, cam, pal);
  const draw = [...Array(n).keys()].map(i => eout(clamp((lt - .25 - i * .12) / 1.1)));
  drawRoutesOverview(c, cam, dark, idx, draw);
  const fr = [.5, .34, .62, .42, .7];
  pillOnRoute(c, cam, idx, fr[idx], fmtDur(ROUTES[idx].durationS), true, dark, draw[idx] > .95 ? 1 : 0);

  // anak panah halus pada kad terpilih
}

function scrS5(c, sw, sh, lt, dur) {
  // Sheet laluan sebenar (laluan terpilih 0) kemudian zum ke baris tol.
  const dark = false, pal = PAL.light;
  const cam = overviewCam(sw, sh, .06, .46, [0], .9);
  drawMap(c, sw, sh, cam, pal);
  drawRoutesOverview(c, cam, dark, 0, 1, { onlySel: true });
  statusBar(c, sw, dark, false, lt);
  const im = img(`real_sheet_0_${LANG}_light.png`);
  const z = 1 + .0 * eio(clamp((lt - .5) / .9));
  const zoom = eio(clamp((lt - .5) / 1.0));
  const baseH = im.naturalHeight * sw / im.naturalWidth;
  c.save();
  // zum ke bahagian tol: anchor pada kira-kira tengah baris tol dalam PNG (y~520/1401)
  const ay = (520 / 1401) * baseH;
  const slide = eout(clamp(lt / .7));
  const sc = lerp(1, 1.2, zoom);
  const top = sh - baseH * slide;
  c.translate(0, top + ay); c.scale(sc, sc); c.translate(0, -(top + ay));
  c.translate(0, -zoom * baseH * .08 * 0);
  c.drawImage(im, 0, top, sw, baseH);

function scrS7(c, sw, sh, lt, dur) {
  const along = lerp(1720, 2180, eio(clamp(lt / dur)));

  }
}

function scrS8(c, sw, sh, lt, dur) {

    if (s.chips) { chips = document.createElement('div'); chips.className = 'chips'; s.chips.forEach(t => { const c = document.createElement('span'); c.className = 'chip'; const i = document.createElement('i'); c.append(i, t); chips.appendChild(c); }); blk.appendChild(chips); }
    let note = null;
    if (s.note || s.tag) { note = document.createElement('div'); note.className = s.tag ? 'chips' : 'note'; if (s.tag) { const c = document.createElement('span'); c.className = 'chip'; const i = document.createElement('i'); c.append(i, s.tag); note.appendChild(c); } else note.textContent = s.note; blk.appendChild(note); }
    cap.appendChild(blk);
    // gaya mengikut format
    const hs = PORT ? 92 : 92, ks = PORT ? 27 : 24, ss = PORT ? 35 : 34, cs = PORT ? 27 : 26;
    k.style.fontSize = ks + 'px'; k.style.padding = `${ks * .42}px ${ks * .8}px`;
    hl.style.fontSize = hs + 'px'; hl.style.lineHeight = '1.04'; hl.style.marginTop = ks * .7 + 'px';
    sub.style.fontSize = ss + 'px'; sub.style.lineHeight = '1.36'; sub.style.marginTop = ss * .6 + 'px';
    if (chips) { chips.style.gap = cs * .5 + 'px'; chips.style.marginTop = ss * .75 + 'px'; chips.querySelectorAll('.chip').forEach(c => { c.style.fontSize = cs + 'px'; c.style.padding = `${cs * .38}px ${cs * .8}px`; c.querySelector('i').style.width = c.querySelector('i').style.height = cs * .34 + 'px'; }); }
    if (note) { if (s.tag) { note.style.marginTop = ss * .6 + 'px'; note.style.gap = cs * .5 + 'px'; note.querySelectorAll('.chip').forEach(c => { c.style.fontSize = cs + 'px'; c.style.padding = `${cs * .38}px ${cs * .8}px`; c.querySelector('i').style.width = c.querySelector('i').style.height = cs * .34 + 'px'; }); } else { note.style.fontSize = ss * .8 + 'px'; note.style.marginTop = ss * .5 + 'px'; } }
    if (PORT) { blk.style.left = '72px'; blk.style.width = W - 144 + 'px'; blk.style.top = (id === 's6' ? 70 : 78) + 'px'; if (id === 's6' || id === 's5') sub.style.display = (id === 's6') ? 'none' : ''; if (note && !s.tag) note.style.display = 'none'; }
    else { blk.style.left = '110px'; blk.style.width = '900px'; blk.style.top = '0'; blk.style.height = H + 'px'; blk.style.display = 'flex'; blk.style.flexDirection = 'column'; blk.style.justifyContent = 'center'; blk.style.alignItems = 'flex-start'; k.style.alignSelf = 'flex-start'; }
    blk._parts = { k, hl, sub, chips, note, words: [...hl.querySelectorAll('.w')], subw: sub };
  }
  // outro
  const ou = el('outro'); ou.innerHTML = ''; ou.style.opacity = 0;
  const S9 = COPY.s9, q = PORT ? 1 : .92;
  ou.innerHTML = `<img class="logo" src="${ASSET}../../app/assets/branding/fgmap-app-icon.png" style="width:${(PORT ? 300 : 250)}px;height:${(PORT ? 300 : 250)}px"><div class="name" style="font-size:${(PORT ? 168 : 150)}px;margin-top:${PORT ? 44 : 30}px">FGMaps</div><div class="tag" style="font-size:${PORT ? 46 : 40}px;margin-top:8px">${S9.tagline}</div><div class="soon" style="font-size:${PORT ? 50 : 44}px;padding:${PORT ? 22 : 18}px ${PORT ? 66 : 56}px;margin-top:${PORT ? 70 : 52}px">${S9.soon}</div><div class="small" style="font-size:${PORT ? 29 : 25}px;margin-top:${PORT ? 62 : 46}px;line-height:1.5">${S9.plat}<br>${S9.credit}<br>${COPY.common.osm}</div>`;
}

function drawBg(t, sceneIdx, lt) {
  const w = BGW, h = BGH, dark = PAL.dark;
  const ov = overviewCam(w, h, 0, 1, [0, 1, 2, 3, 4], .8 + .08 * Math.sin(t * .1));
  const cam = mkCam(ov.fx + Math.sin(t * .05) * 3000, ov.fy + Math.cos(t * .04) * 2000, t * .02, 90, ov.ppm * 1.7, w / 2, h / 2);
  drawMap(bctx, w, h, cam, dark);
  const k = PAL.dark; bctx.save(); bctx.globalCompositeOperation = 'source-over';
  for (let i = 0; i < OV.length; i++) strokeRoute(bctx, cam, OV[i], 0, OV[i].len, 5, i === 0 ? 'rgba(25,211,184,.55)' : 'rgba(110,140,200,.28)', 1);
  bctx.restore();
}

function updateCaptions(t, i, lt, dur) {
  const id = TL[i][0];
  const blks = [...el('cap').children];
  blks.forEach(b => { if (b.dataset.id !== id) b.style.opacity = 0; });
  const blk = blks.find(b => b.dataset.id === id); if (!blk) return;
  const P = blk._parts; blk.style.opacity = 1;
  const out = sstep(dur - .38, dur - .02, lt);
  const ap = (node, delay, dy = 34) => { const a = eout((lt - delay) / .55); node.style.opacity = clamp(a) * (1 - out); node.style.transform = `translateY(${(1 - eback((lt - delay) / .7)) * dy - out * 22}px)`; };
  ap(P.k, .1, 18);
  P.words.forEach((w, wi) => ap(w, .22 + wi * .075, 52));
  const hd = .22 + P.words.length * .075 + .1;
  ap(P.sub, hd, 24);
  if (P.chips) [...P.chips.children].forEach((c, ci) => ap(c, hd + .25 + ci * .1, 20));
  if (P.note) { if (P.note.classList.contains('chips')) [...P.note.children].forEach(c => ap(c, hd + .35, 20)); else ap(P.note, hd + .6, 16); }
}

function updatePhone(t, i, lt, dur) {
  const id = TL[i][0];
  const ph = el('phone');
  let x = 0, y = 0, sc = 1, ry = 0, rx = 0, rz = 0, op = 1;
  const f = Math.sin(t * 1.25) * 7;
  if (PORT) { ry = Math.sin(t * .6) * 2.2; rx = 3 + Math.sin(t * .5) * 1; y = f; }
  else { ry = -11 + Math.sin(t * .55) * 2.2; rx = 4 + Math.sin(t * .45) * 1; rz = -1.2; y = f; }
  // masuk di awal video
  if (i === 0) { const a = eback(lt / 1.0); sc = lerp(.82, 1, a); y += (1 - clamp(a)) * 160; op = clamp(lt / .5); }
  // kejutan kecil pada peralihan babak
  const tb = Math.min(...TL.map(([_, a, b]) => Math.min(Math.abs(t - a), Math.abs(t - b))));
  if (t > .5 && tb < .3) { const k = 1 - tb / .3; sc *= 1 + .02 * Math.sin(k * Math.PI); }
  if (id === 's9') { const a = eio(clamp(lt / .9)); y += a * (PORT ? 900 : 120); x += a * (PORT ? 0 : 520); sc *= 1 - .18 * a; op = 1 - a; }
  ph.style.opacity = op;
  ph.style.transform = `translate3d(${x}px,${y}px,0) scale(${sc}) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg)`;
  ph.style.transformOrigin = `${SW / 2}px ${SH / 2}px`;
}

function updateOutro(t, i, lt, dur) {
  const ou = el('outro'); const id = TL[i][0];
  if (id !== 's9') { ou.style.opacity = 0; return; }
  const a = eout((lt - .35) / .7);
  ou.style.opacity = a;
  const kids = [...ou.children];
  kids.forEach((k, ki) => { const aa = eback((lt - .45 - ki * .16) / .7); k.style.opacity = clamp(eout((lt - .4 - ki * .16) / .5)); k.style.transform = `translateY(${(1 - aa) * 40}px) scale(${lerp(.9, 1, clamp(aa))})`; });
  const lg = ou.querySelector('.logo'); lg.style.transform = `scale(${lerp(.5, 1, eback((lt - .4) / .9))}) rotate(${(1 - eout((lt - .4) / .9)) * -12}deg)`;
}

function updateBackdrop(t, i, lt, dur) {
  const id = TL[i][0];
  const hueSet = { s1: ['#2563EB', '#19D3B8'], s2: ['#19D3B8', '#2563EB'], s3: ['#2563EB', '#4F8BFF'], s4: ['#19D3B8', '#4F8BFF'], s5: ['#4F8BFF', '#19D3B8'], s6: ['#2563EB', '#19D3B8'], s7: ['#7C5CFF', '#2563EB'], s8: ['#19D3B8', '#2563EB'], s9: ['#19D3B8', '#4F8BFF'] }[id];
  const g1 = el('glowA'), g2 = el('glowB');
  g1.style.background = hueSet[0]; g2.style.background = hueSet[1];
  g1.style.opacity = .42; g2.style.opacity = .34;
  g1.style.left = (PORT ? -200 + Math.sin(t * .35) * 80 : 60 + Math.sin(t * .35) * 60) + 'px'; g1.style.top = (PORT ? 40 : -140) + 'px';
  g2.style.left = (PORT ? W - W * .5 + 120 + Math.cos(t * .3) * 80 : W - W * .5 - 40 + Math.cos(t * .3) * 80) + 'px'; g2.style.top = (PORT ? H * .5 + Math.sin(t * .4) * 70 : H * .35) + 'px';
  el('shade').style.background = `radial-gradient(ellipse at 50% 38%, rgba(11,18,32,.5), rgba(11,18,32,.88) 78%), linear-gradient(180deg, rgba(11,18,32,.35), rgba(11,18,32,.75))`;
  el('foot').style.opacity = id === 's9' ? 0 : .9;
}

function updateFlash(t) {
  let a = 0, cx = .5;
  for (const [id, t0] of TL) { if (t0 === 0) continue; const d = (t - t0); if (d > -.22 && d < .38) { const p = (d + .22) / .6; a = Math.max(a, Math.sin(p * Math.PI)); cx = p; } }
  const f = el('flash');
  f.style.opacity = a * .9;
  f.style.background = `linear-gradient(105deg, rgba(25,211,184,0) ${cx * 140 - 40}%, rgba(25,211,184,.35) ${cx * 140 - 25}%, rgba(255,255,255,.55) ${cx * 140 - 18}%, rgba(79,139,255,.25) ${cx * 140 - 8}%, rgba(79,139,255,0) ${cx * 140}%)`;
}

function renderFrame(t) {
  t = clamp(t, 0, DUR - 1e-3);
  let i = TL.findIndex(([_, a, b]) => t >= a && t < b); if (i < 0) i = TL.length - 1;
  const [id, t0, t1] = TL[i], lt = t - t0, dur = t1 - t0;
  drawBg(t, i, lt);
  sctx.clearRect(0, 0, SW, SH);
  SCENES[id](sctx, SW, SH, lt, dur);
  // pemudar silang ke babak seterusnya
  if (i < TL.length - 1 && t1 - t < .3) {
    const nid = TL[i + 1][0];
    if (nid !== 's9') { sctx.save(); sctx.globalAlpha = 1 - (t1 - t) / .3; SCENES[nid](sctx, SW, SH, 0, TL[i + 1][2] - TL[i + 1][1]); sctx.restore(); }
  }
  updateBackdrop(t, i, lt, dur); updatePhone(t, i, lt, dur); updateCaptions(t, i, lt, dur); updateOutro(t, i, lt, dur); updateFlash(t);
  return true;
}
window.renderFrame = renderFrame;
window.DUR = DUR; window.W = W; window.H = H;
window.__ready = (async () => { await loadAll(); buildGeo(); layout(); renderFrame(0); return true; })();
</script>
