name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mingguan: kerentanan baharu boleh didedahkan walaupun kod tidak berubah.
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Kotlin/Java)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # maplibre_gl mengkompil sumber Java 21. JDK 17 menolaknya
          # ("invalid source release: 21"). Aplikasi sendiri kekal sasaran 17.
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.7"
          channel: stable
          cache: true

      # build-mode none hanya mengekstrak Java. Projek ini Kotlin, jadi CodeQL
      # tidak nampak sumber dan gagal ("no source code seen"). Bina secara manual
      # supaya penyurih melihat kotlinc. local.properties tidak dikomit.
      - name: Sediakan Flutter dan Android SDK
        working-directory: app
        run: |
          set -euo pipefail
          flutter pub get
          # `yes` menerima SIGPIPE bila flutter tutup paip. Dengan pipefail itu
          # menjadi kod 141 walaupun lesen sudah diterima.
          set +o pipefail
          yes | flutter doctor --android-licenses
          license_status=${PIPESTATUS[1]}
          set -o pipefail
          if [ "$license_status" -ne 0 ]; then
            echo "flutter doctor --android-licenses gagal ($license_status)" >&2
            exit "$license_status"
          fi
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$sdk" ] && [ -d /usr/local/lib/android/sdk ]; then
            sdk=/usr/local/lib/android/sdk
          fi
          if [ -z "$sdk" ] || [ -z "${FLUTTER_ROOT:-}" ]; then
            echo "Android SDK atau FLUTTER_ROOT tiada pada pelari" >&2
            exit 1
          fi
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$sdk" "$FLUTTER_ROOT" > android/local.properties
          printf '\norg.gradle.daemon=false\norg.gradle.caching=false\n' >> android/gradle.properties
          # gradlew, gradlew.bat, dan gradle-wrapper.jar diabaikan oleh git.
          # Flutter menyimpannya dalam cache dan menyalinnya semasa binaan.
          if [ ! -f "$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper/gradlew" ]; then
            flutter precache
          fi
          src="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          cp "$src/gradlew" "$src/gradlew.bat" android/
          mkdir -p android/gradle/wrapper
          cp "$src/gradle/wrapper/gradle-wrapper.jar" android/gradle/wrapper/
          chmod +x android/gradlew

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Kompil Kotlin aplikasi
        working-directory: app/android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --no-build-cache --rerun-tasks --stacktrace

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin

  osv:
    name: Kebergantungan (OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Imbas pubspec.lock (Dart) dan fail kunci Gradle terhadap pangkalan data kerentanan OSV.
      - uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --lockfile=app/pubspec.lock
            --recursive
            ./app/android

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anchore/sbom-action@v0
        with:
          path: app
          format: cyclonedx-json
          artifact-name: fgmap-sbom.cdx.json
