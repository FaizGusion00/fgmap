name: tolls-explore

# Sementara: meneroka titik akhir kalkulator LLM dan Overpass dari runner GitHub (container
# pembangunan tidak boleh mencapainya). Dibuang selepas data difahami.
on:
  push:
    branches: [claude/practical-bardeen-kmtow6]
    paths: [".github/workflows/tolls-explore.yml", "tools/tolls/explore.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/tolls/explore.py
      - name: Simpan imej yang dimuat turun (sementara)
        run: |
          if ls tools/tolls/cache/* >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/tolls/cache
            git commit -m "chore(tolls): imej tambang untuk bacaan manual (sementara)" && git push || true
          fi
