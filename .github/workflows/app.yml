name: app

on:
  push:
    branches: [main]
    paths: ["app/**", "packages/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "packages/**", ".github/workflows/app.yml"]

permissions:
  contents: read

env:
  # Sama dengan versi pembangunan. Golden bergantung pada versi Flutter; naikkan bersama kemas kini golden.
  # Mesti memenuhi app/pubspec.yaml sdk: ^3.12.0 (Dart ≥ 3.12).
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # l10n dijana dan di-commit; jika berbeza daripada .arb, build gagal.
      - name: Generated code is up to date
        run: |
          flutter gen-l10n
          git diff --exit-code -- .

      - run: flutter analyze

      # Golden dijalankan pada macOS (job di bawah): render teks berbeza sedikit antara platform.
      - run: flutter test --exclude-tags golden

  golden:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Sementara: jana semula garis asas trip planner (Home/Work/recents) pada
      # pelari macOS. Commit PNG daripada artifak, kemudian pulihkan --tags golden.
      - run: flutter test --update-goldens --tags golden

      - uses: actions/upload-artifact@v4
        with:
          name: macos-goldens
          path: app/test/**/goldens/*.png
          if-no-files-found: error
