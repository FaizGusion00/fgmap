name: routes-probe

# Sementara: mengukur strategi laluan alternatif terhadap Valhalla awam (container pembangunan tidak boleh
# mencapainya). Dibuang selepas keputusan digunakan.
on:
  push:
    branches: [claude/practical-bardeen-kmtow6]
    paths: [".github/workflows/routes-probe.yml", "tools/routes/probe.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/routes/probe.py
      - name: Simpan keputusan
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/routes/out
          git commit -m "chore(routes): keputusan probe (sementara)" && git push || true
