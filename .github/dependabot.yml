# Kemas kini kebergantungan automatik (keselamatan dan versi). Setiap ekosistem dikelompokkan supaya
# PR tidak membanjiri; pengemas kini keselamatan tetap dibuka serta-merta.
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
    groups:
      pub-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: pub
    directory: /packages/fgmap_valhalla
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /app/android
    schedule:
      interval: weekly
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
